<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12382f">
    <title>Aviso QR</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card" aria-labelledby="title">
      <div class="brand-mark" aria-hidden="true">GB</div>
      <p class="eyebrow">GRUPO BRESTON</p>
      <h1 id="title">Aviso QR</h1>
      <p id="context" class="context">Comprobando el enlace…</p>
      <div id="status" class="status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">Preparando el aviso</span>
      </div>
      <form id="alert-form" class="alert-form" hidden>
        <label for="alert-type">¿Qué necesitas?</label>
        <select id="alert-type" name="tipo_de_aviso" required></select>
        <label for="local-code">Código del local</label>
        <input id="local-code" name="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
        <p class="form-note">Introduce el código que aparece en el local.</p>
        <button id="send-button" type="submit">Enviar aviso</button>
      </form>
      <p id="help" class="help">Introduce el código que aparece en el local.</p>
    </main>
    <footer>Servicio de avisos por QR</footer>
  </body>
</html>
